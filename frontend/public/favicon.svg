<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Dashcam Analyser">
  <!--
    A dashcam seen head-on: body, lens, and the road it is pointed at.

    Drawn for 16 px first. Everything here is a solid shape with a wide gap around it,
    because at favicon size strokes thinner than about 2 px disappear into the tab and
    detail below roughly a fifth of the canvas turns to mush. The road is two blocks rather
    than a tapering perspective for the same reason.

    Colours are the application's own accent (#256edc light / #609cff dark), so the tab
    icon and the UI read as one thing. It is a single flat file with no gradients or
    filters: a favicon is decoded thousands of times and never seen larger than 64 px.
  -->
  <rect width="32" height="32" rx="7" fill="#1b2433" />

  <!-- Road: two lanes running to the horizon, suggested rather than drawn in perspective. -->
  <path d="M6 26h20l-3-7H9z" fill="#2c3852" />
  <rect x="15" y="20" width="2" height="3" rx="1" fill="#5b6b8a" />

  <!-- Camera body. -->
  <rect x="7" y="6" width="18" height="12" rx="3" fill="#609cff" />
  <!-- Lens, with a highlight so it reads as glass and not a hole. -->
  <circle cx="16" cy="12" r="4.2" fill="#0f1622" />
  <circle cx="16" cy="12" r="2.1" fill="#9cc4ff" />
  <circle cx="14.7" cy="10.7" r="0.8" fill="#eaf2ff" />
</svg>
