services:
  dashcam:
    image: ghcr.io/poshy163/dashcam-analyser:latest
    container_name: dashcam-analyser
    restart: unless-stopped

    ports:
      - 8098:8080

    devices:
      # Exposes the iGPU for hardware video decode (VAAPI) and OpenVINO inference.
      # Remove this line to run CPU-only; the app detects the change and adapts.
      - /dev/dri:/dev/dri

    volumes:
      # Application database, settings, thumbnails, crops and models. Never deleted by
      # retention under any circumstance.
      - dashcam-data:/data

      # Your raw footage. Mounted read-only, which is the recommended default: retention
      # reports what it would remove instead of deleting, and nothing in the container can
      # touch the originals whatever it decides.
      #
      # Drop the `:ro` only if you want one of the two features that write here:
      #   * Settings > Backup / Ingest, which copies recordings off the dashcam's head unit
      #     while the car is on the driveway (it refuses to run against a share it cannot
      #     verify is mounted and writable, rather than writing into the mount point);
      #   * automatic deletion in Settings > Storage.
      - /mnt/Vault/dashcam:/dashcam:ro

    # Everything else is configured in the web UI. These are the only variables that
    # exist, and all of them already have sensible defaults.
    #
    # There is no password here any more. Sign-in is a UI setting — Settings > Access —
    # with the account in the database, so turning it on no longer means writing a
    # password into this file in clear text and restarting the container. Turn it on
    # before putting the app on a public hostname; see examples/cloudflare-tunnel/.
    environment:
      - TZ=Australia/Adelaide
      # - DASHCAM_LOG_LEVEL=INFO

volumes:
  dashcam-data:
