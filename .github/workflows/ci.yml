name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      # The test suite generates its own fixture clips rather than committing video,
      # so a real ffmpeg has to be present.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Run from the repo root: the package is under backend/ but the suite is at the
      # root, and ruff.toml at the root covers both.
      - name: Ruff
        run: ruff check backend/app backend/scripts tests

      - name: Ruff format check
        run: ruff format --check backend/app backend/scripts tests

      - name: Generate test fixtures
        run: python backend/scripts/make_fixtures.py --out tests/fixtures

      - name: Pytest
        env:
          PYTHONPATH: backend
        run: pytest tests -v --tb=short --durations=15

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Build only — publishing happens in release.yml. This exists so a broken
      # Dockerfile fails the PR rather than the release.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: dashcam-analyser:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=ci-${{ github.sha }}
            VCS_REF=${{ github.sha }}

      # A container that starts but cannot serve /health is a broken release, and that
      # is not something the unit tests can catch.
      - name: Smoke test the image
        run: |
          docker run -d --name dashcam-smoke \
            -e DASHCAM_DATA_DIR=/data \
            -e DASHCAM_FOOTAGE_DIR=/dashcam \
            -p 8080:8080 \
            dashcam-analyser:ci

          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8080/health > /tmp/health.json 2>/dev/null; then
              echo "health endpoint responded:"
              cat /tmp/health.json
              echo
              # The UI must actually be served, not just the API.
              curl -fsS http://127.0.0.1:8080/ -o /dev/null
              echo "UI served OK"
              docker rm -f dashcam-smoke
              exit 0
            fi
            sleep 2
          done

          echo "container failed to become healthy; logs follow:"
          docker logs dashcam-smoke
          docker rm -f dashcam-smoke
          exit 1
