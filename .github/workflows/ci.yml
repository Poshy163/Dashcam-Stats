name: CI

# Pushes are not listed here, deliberately: release.yml owns them and calls this workflow
# as its first job, so publishing physically cannot happen before the tests have passed.
#
# It used to be the other way round. ci.yml ran on pushes to main while release.yml, with no
# dependency on it at all, pushed `:main` and `:sha-...` to GHCR in parallel — so a red
# build still shipped an image. Worse, a `v*` tag matched none of ci.yml's triggers, so a
# release ran no tests, no lint and not even the Docker build, while moving `:latest` — the
# tag the README tells every new user to pull.
#
# `workflow_call` rather than `workflow_run`: a called workflow runs in the caller's event
# context, so `github.ref` is the branch or tag actually being released and the image tags
# derive from it correctly. `workflow_run` would have run in the default branch's context
# instead, and would additionally have fired for pull requests — including forks, with a
# writable token.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      # The test suite generates its own fixture clips rather than committing video,
      # so a real ffmpeg has to be present.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Run from the repo root: the package is under backend/ but the suite is at the
      # root, and ruff.toml at the root covers both.
      #
      # The version is printed because it is load-bearing. `ruff format --check` compares
      # the tree against whatever version is installed, so when this step failed for three
      # commits running while the same command passed locally, the answer was not in the
      # diff -- it was that CI had resolved 0.14.14 and the developer had 0.16.2. It is
      # pinned exactly in requirements-dev.txt now, and tests/test_code_style.py fails if
      # the two ever drift apart again.
      - name: Ruff
        run: |
          ruff --version
          ruff check backend/app backend/scripts tests

      - name: Ruff format check
        run: ruff format --check backend/app backend/scripts tests

      - name: Generate test fixtures
        run: python backend/scripts/make_fixtures.py --out tests/fixtures

      - name: Pytest
        env:
          PYTHONPATH: backend
        run: pytest tests -v --tb=short --durations=15

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Build only — publishing happens in release.yml. This exists so a broken
      # Dockerfile fails the PR rather than the release.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: dashcam-analyser:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=ci-${{ github.sha }}
            VCS_REF=${{ github.sha }}

      # Merely listing OpenVINOExecutionProvider is insufficient: an ABI-mismatched
      # OpenVINO library still appears in get_available_providers(), but fails only when
      # an actual session is created and ONNX Runtime silently falls back to CPU.
      - name: Verify OpenVINO direct inference
        run: |
          # Read the expected version out of the pin rather than repeating it here. This
          # step used to assert "2026.3." literally, so pinning the runtime back to
          # 2025.4.1 -- which is a thing that happens, and did -- failed the build for a
          # reason that had nothing to do with the image being wrong.
          expected="$(sed -n 's/^openvino==\([0-9][0-9.]*\).*/\1/p' backend/requirements.txt)"
          test -n "$expected" || { echo "no openvino== pin found in requirements"; exit 1; }
          echo "expecting OpenVINO $expected"
          docker run --rm --entrypoint python -e EXPECTED_OPENVINO="$expected" dashcam-analyser:ci -c '
          import os
          import openvino as ov
          import numpy as np
          from onnxruntime.datasets import get_example
          from app.ai.openvino_session import OpenVINOSession
          from app.hardware.detect import detect_hardware

          expected = os.environ["EXPECTED_OPENVINO"]
          hardware = detect_hardware()
          session = OpenVINOSession(get_example("mul_1.onnx"), device="CPU")
          model_input = session.get_inputs()[0]
          output = session.run(
              None,
              {model_input.name: np.ones(model_input.shape, dtype=np.float32)},
          )
          assert ov.__version__.startswith(expected), (ov.__version__, expected)
          assert session.get_providers() == ["OpenVINO:CPU"]
          assert output
          print("OpenVINO", ov.__version__, "direct inference OK", hardware.openvino_devices)
          '

      # Both Intel drivers, together. They are a matched set through gmmlib, and upgrading
      # only the compute runtime on the deployment replaced the gmmlib that Bookworm's iHD
      # media driver was built against -- which took VAAPI out entirely, vaapi_available
      # going true to false, while not bringing the OpenCL device back either. So this
      # reports both and fails only on the media driver going missing, which is the one
      # that silently turns every decode into software.
      - name: Report the Intel graphics stack in the image
        run: |
          docker run --rm --entrypoint sh dashcam-analyser:ci -c '
            dpkg-query -W intel-opencl-icd libigdgmm12 intel-media-va-driver-non-free \
              intel-media-va-driver 2>/dev/null || true
            for d in /usr/lib/x86_64-linux-gnu/dri/*_drv_video.so; do
              [ -e "$d" ] && echo "va driver: $d"
            done
            test -e /usr/lib/x86_64-linux-gnu/dri/iHD_drv_video.so || {
              echo "::error::the iHD media driver is missing; every decode falls back to software"
              exit 1
            }
          '

      # A container that starts but cannot serve /health is a broken release, and that
      # is not something the unit tests can catch.
      #
      # Three separate things are checked here, and each has broken independently before:
      # that the app answers, that the image's own HEALTHCHECK agrees it answers, and that
      # the entrypoint actually dropped root. The middle one matters because the healthcheck
      # is what an orchestrator restarts on -- it runs `curl` inside the container against
      # $DASHCAM_PORT, so a slimmed base image or a renamed port variable turns every
      # deployment into a restart loop while a curl from the runner still passes.
      - name: Smoke test the image
        run: |
          set -u
          trap 'docker rm -f dashcam-smoke >/dev/null 2>&1 || true' EXIT

          docker run -d --name dashcam-smoke \
            -e DASHCAM_DATA_DIR=/data \
            -e DASHCAM_FOOTAGE_DIR=/dashcam \
            -p 8080:8080 \
            dashcam-analyser:ci

          ok=""
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8080/health > /tmp/health.json 2>/dev/null; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "::error::the container never served /health; logs follow:"
            docker logs dashcam-smoke
            exit 1
          fi
          echo "health endpoint responded:"
          cat /tmp/health.json
          echo

          # The UI must actually be served, not just the API.
          curl -fsS http://127.0.0.1:8080/ -o /dev/null
          echo "UI served OK"

          # The image's own healthcheck, on its own terms. Docker only starts reporting a
          # status once the first probe has run, so this waits for it to leave "starting"
          # rather than reading it once.
          status=starting
          for i in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' dashcam-smoke)"
            [ "$status" = starting ] || break
            sleep 2
          done
          if [ "$status" != healthy ]; then
            echo "::error::the image's HEALTHCHECK reports '$status' while /health answers"
            docker inspect -f '{{json .State.Health}}' dashcam-smoke
            exit 1
          fi
          echo "HEALTHCHECK: $status"

          # The entrypoint drops to the unprivileged account before exec'ing the app. A
          # release that serves perfectly well as root is still a release nobody should
          # mount their footage share into.
          app_user="$(docker exec dashcam-smoke sh -c 'ps -o user= -p 1; echo ---; ps -o user= -C python | head -1')"
          echo "process owners: $app_user"
          if docker exec dashcam-smoke sh -c 'ps -o user=,comm= | grep -q "^root *python"'; then
            echo "::error::the app is running as root; the entrypoint did not drop privileges"
            docker exec dashcam-smoke ps -o user=,pid=,comm=
            exit 1
          fi
          echo "privilege drop OK"
