name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      # The test suite generates its own fixture clips rather than committing video,
      # so a real ffmpeg has to be present.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Run from the repo root: the package is under backend/ but the suite is at the
      # root, and ruff.toml at the root covers both.
      #
      # The version is printed because it is load-bearing. `ruff format --check` compares
      # the tree against whatever version is installed, so when this step failed for three
      # commits running while the same command passed locally, the answer was not in the
      # diff -- it was that CI had resolved 0.14.14 and the developer had 0.16.2. It is
      # pinned exactly in requirements-dev.txt now, and tests/test_code_style.py fails if
      # the two ever drift apart again.
      - name: Ruff
        run: |
          ruff --version
          ruff check backend/app backend/scripts tests

      - name: Ruff format check
        run: ruff format --check backend/app backend/scripts tests

      - name: Generate test fixtures
        run: python backend/scripts/make_fixtures.py --out tests/fixtures

      - name: Pytest
        env:
          PYTHONPATH: backend
        run: pytest tests -v --tb=short --durations=15

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Build only — publishing happens in release.yml. This exists so a broken
      # Dockerfile fails the PR rather than the release.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: dashcam-analyser:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=ci-${{ github.sha }}
            VCS_REF=${{ github.sha }}

      # Merely listing OpenVINOExecutionProvider is insufficient: an ABI-mismatched
      # OpenVINO library still appears in get_available_providers(), but fails only when
      # an actual session is created and ONNX Runtime silently falls back to CPU.
      - name: Verify OpenVINO direct inference
        run: |
          # Read the expected version out of the pin rather than repeating it here. This
          # step used to assert "2026.3." literally, so pinning the runtime back to
          # 2025.4.1 -- which is a thing that happens, and did -- failed the build for a
          # reason that had nothing to do with the image being wrong.
          expected="$(sed -n 's/^openvino==\([0-9][0-9.]*\).*/\1/p' backend/requirements.txt)"
          test -n "$expected" || { echo "no openvino== pin found in requirements"; exit 1; }
          echo "expecting OpenVINO $expected"
          docker run --rm --entrypoint python -e EXPECTED_OPENVINO="$expected" dashcam-analyser:ci -c '
          import os
          import openvino as ov
          import numpy as np
          from onnxruntime.datasets import get_example
          from app.ai.openvino_session import OpenVINOSession
          from app.hardware.detect import detect_hardware

          expected = os.environ["EXPECTED_OPENVINO"]
          hardware = detect_hardware()
          session = OpenVINOSession(get_example("mul_1.onnx"), device="CPU")
          model_input = session.get_inputs()[0]
          output = session.run(
              None,
              {model_input.name: np.ones(model_input.shape, dtype=np.float32)},
          )
          assert ov.__version__.startswith(expected), (ov.__version__, expected)
          assert session.get_providers() == ["OpenVINO:CPU"]
          assert output
          print("OpenVINO", ov.__version__, "direct inference OK", hardware.openvino_devices)
          '

      # The Dockerfile deliberately lets the Intel driver install fail rather than break
      # the build, which means it can also fail *silently* -- and the whole point of
      # installing it is that Debian's 2022 driver is what the deployment's iGPU aborts
      # in. Without this the image would ship the old driver and look fine.
      - name: Verify the Intel compute-runtime that actually shipped
        run: |
          expected="$(sed -n 's/^ARG NEO_VERSION=\(.*\)/\1/p' Dockerfile)"
          test -n "$expected" || { echo "no NEO_VERSION found in the Dockerfile"; exit 1; }
          installed="$(docker run --rm --entrypoint dpkg-query dashcam-analyser:ci \
            -W -f='${Version}' intel-opencl-icd)"
          echo "intel-opencl-icd: want ${expected}, image has ${installed}"
          case "$installed" in
            "${expected}"*) echo "Intel compute-runtime installed" ;;
            *) echo "::error::image shipped ${installed} instead of ${expected};" \
                    "the Intel driver download or dpkg step failed"; exit 1 ;;
          esac

      # A container that starts but cannot serve /health is a broken release, and that
      # is not something the unit tests can catch.
      - name: Smoke test the image
        run: |
          docker run -d --name dashcam-smoke \
            -e DASHCAM_DATA_DIR=/data \
            -e DASHCAM_FOOTAGE_DIR=/dashcam \
            -p 8080:8080 \
            dashcam-analyser:ci

          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8080/health > /tmp/health.json 2>/dev/null; then
              echo "health endpoint responded:"
              cat /tmp/health.json
              echo
              # The UI must actually be served, not just the API.
              curl -fsS http://127.0.0.1:8080/ -o /dev/null
              echo "UI served OK"
              docker rm -f dashcam-smoke
              exit 0
            fi
            sleep 2
          done

          echo "container failed to become healthy; logs follow:"
          docker logs dashcam-smoke
          docker rm -f dashcam-smoke
          exit 1
