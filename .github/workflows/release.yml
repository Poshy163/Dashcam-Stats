name: Publish to GHCR

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/dashcam-analyser

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The tests, run as part of this workflow rather than beside it.
  #
  # `needs: ci` below waits for every job in ci.yml, so a red build cannot publish. Calling
  # it keeps `github.ref` pointing at the branch or tag being released, which is what makes
  # the tag derivation below correct — and it means a fork's pull request can never reach
  # this workflow at all.
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      export-image: true

  publish:
    needs: ci
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Needed to attach build provenance to the published image.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Download this run's tested image
        uses: actions/download-artifact@v4
        with:
          name: tested-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tested-image

      - name: Verify and load the tested image
        env:
          EXPECTED_IMAGE_ID: ${{ needs.ci.outputs.image-id }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/tested-image"
          sha256sum --check dashcam-tested-image.sha256
          docker load --input dashcam-tested-image.tar.gz
          actual="$(docker image inspect --format '{{.Id}}' dashcam-analyser:ci)"
          test -n "$EXPECTED_IMAGE_ID" && test "$actual" = "$EXPECTED_IMAGE_ID"
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' dashcam-analyser:ci)"
          test "$revision" = "$EXPECTED_REVISION"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            # `latest` only ever points at a released tag, never at a main-branch build.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Promote the tested image without rebuilding
        id: promote
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          first=""
          while IFS= read -r tag; do
            test -n "$tag" || continue
            test -n "$first" || first="$tag"
            docker tag dashcam-analyser:ci "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
          test -n "$first"
          digest="$(docker buildx imagetools inspect "$first" --format '{{.Manifest.Digest}}')"
          test -n "$digest"
          while IFS= read -r tag; do
            test -n "$tag" || continue
            actual="$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')"
            test "$actual" = "$digest"
          done <<< "$IMAGE_TAGS"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.promote.outputs.digest }}
          push-to-registry: true

  release-notes:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Container image

            ```
            ghcr.io/${{ github.repository_owner }}/dashcam-analyser:${{ github.ref_name }}
            ```

            See the [README](https://github.com/${{ github.repository }}#readme) for setup.
