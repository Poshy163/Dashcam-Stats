org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# Reuse task output instead of redoing it. `gradle/actions/setup-gradle` already wires a
# GitHub-Actions-backed remote build cache into CI, and without this flag Gradle never
# consulted it: the job re-ran unit tests, two lint passes and two assembles from cold on
# every commit, about two minutes, most of it work whose inputs had not changed.
org.gradle.caching=true

# Independent tasks in parallel. The runner has four cores and this build has debug and
# release variants that share nothing, so lint and assemble for one need not wait on the
# other.
org.gradle.parallel=true
