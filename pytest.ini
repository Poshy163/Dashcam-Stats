[pytest]
# The suite lives at the repo root while the package lives under backend/, so the
# configuration has to be here rather than in backend/pyproject.toml — pytest reads the
# config from the rootdir it is invoked in.
testpaths = tests
pythonpath = backend

# Async tests and fixtures are the norm here (the whole data layer is async), so mark
# them implicitly rather than decorating every one.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

addopts = --strict-markers --tb=short
markers =
    needs_ffmpeg: requires a real ffmpeg binary
    slow: decodes video and takes a few seconds

filterwarnings =
    ignore::DeprecationWarning:asyncio
