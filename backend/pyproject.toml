[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dashcam-analyser"
version = "0.1.0"
description = "Self-hosted analysis of dashcam footage: telemetry OCR, object tracking and plate reading."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Joshua Leaper" }]

dependencies = [
    "fastapi>=0.142.1,<0.143",
    "starlette>=1.7.0,<2",
    "uvicorn[standard]>=0.54.0,<0.55",
    "python-multipart>=0.0.32,<0.1",
    "SQLAlchemy[asyncio]>=2.1.1,<2.2",
    "aiosqlite>=0.22.1,<0.23",
    "alembic>=1.20.0,<1.21",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15.0,<3",
    "opencv-python-headless>=4.14,<5",
    "numpy>=1.26,<3",
    "Pillow>=12.3.0,<13",
    "openvino==2025.4.1",
    "onnxruntime==1.27.0",
    "open-image-models>=0.6,<1",
    "fast-plate-ocr>=1.1,<2",
    "structlog>=26.1,<27",
    "httpx>=0.27,<0.29",
    "paho-mqtt>=2.1,<3",
    "tzdata>=2026.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1,<8",
    "pytest-xdist>=3.6,<4",
    "anyio>=4.6,<5",
    "asgi-lifespan>=2.1,<3",
    "ruff==0.16.9",
    "mypy>=1.13,<2",
    "types-requests",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = ["app", "migrations", "alembic.ini", "tests"]

# Ruff is configured once at the repository root (ruff.toml) so the package under
# backend/ and the test suite at the root share one ruleset. Ruff resolves the
# nearest config per file, so a [tool.ruff] section here would silently override it.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.mypy]
python_version = "3.11"
plugins = []
packages = ["app"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = true
# Third-party CV/inference wheels ship no stubs; the app's own code is still checked.
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["migrations.*"]
ignore_errors = true
