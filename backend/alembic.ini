[alembic]
script_location = migrations

# Keeps `alembic revision` output ordered on disk: 0001_initial, 0002_..., not hashes.
file_template = %%(rev)s_%%(slug)s

# So `alembic ...` run from backend/ can import the `app` package.
prepend_sys_path = .

# Filename timestamps are naive local time; UTC here would only confuse the mapping.
timezone =

# Left blank on purpose. env.py takes the URL from app.config.get_config(), which is the
# single source of truth for where /data lives. Setting it here would let a stale ini
# point migrations at a different database than the running application.
sqlalchemy.url =


[post_write_hooks]
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
